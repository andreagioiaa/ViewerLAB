[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "media-center-cli"
version = "0.1.0"
description = "Media Center modulare asincrono con Canali, Resolver, TMDB e CLI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Media Center" }]
dependencies = [
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pydantic>=2.7,<3",
    "PyYAML>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "tenacity>=8.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[project.scripts]
media-center = "cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "cli*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008", "E501"]
